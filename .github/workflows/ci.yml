name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.10.0
        with:
          pixi-version: v0.70.1
          frozen: true
          cache: true

      - name: Check formatting
        run: pixi run ruff format --check --force-exclude

      - name: Lint
        run: pixi run ruff check --force-exclude

      - name: Test
        run: pixi run test
