[project]
name = "pymol_plugins"
version = "0.1.0"
description = "Plugings for PyMOL"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cuemol-style-in-pymol @ git+https://github.com/th2ch-g/cuemol_style_in_pymol.git@da0c20b30a97bcf69ada29e9ca7d4801aa9bae8e",
]

[tool.pixi.project]
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64", "osx-arm64", "osx-64"]

[tool.pixi.dependencies]
pymol-open-source = "==3.1.0"

[tool.pixi.pypi-dependencies]
pymol_plugins = { path = ".", editable = true }
